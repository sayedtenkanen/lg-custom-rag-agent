[project]
name = "lg-custom-rag-agent"
version = "0.1.0"
description = "A custom RAG agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=0.5",
    "langchain>=0.3",
    "langchain-chroma>=0.1",
    "langchain-core>=0.3",
    "langchain-jina>=0.0.1.dev0",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "posthog>=2.4,<6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.scripts]
rag-agent = "lg_custom_rag_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]